<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тесты и оценки — Онлайн Школа №1</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
            background:linear-gradient(160deg,#1a0840 0%,#2d1b69 50%,#1a0840 100%);
            min-height:100vh; color:#fff;
        }
        .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .star  { position:absolute; background:#fff; border-radius:50%;
                 animation:twinkle var(--d,3s) infinite alternate; }
        @keyframes twinkle {
            0%  { opacity:.1; transform:scale(1); }
            100%{ opacity:.7; transform:scale(1.4); }
        }

        .topbar {
            position:sticky; top:0; z-index:50;
            background:rgba(26,8,64,.9); backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(255,255,255,.08);
            padding:14px 20px; display:flex; align-items:center; gap:12px;
        }
        .back-btn {
            display:flex; align-items:center; gap:6px;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
            border-radius:10px; padding:7px 13px; font-size:13px; font-weight:600;
            cursor:pointer; color:#fff; text-decoration:none; transition:background .2s;
        }
        .back-btn:hover { background:rgba(255,255,255,.16); }
        .topbar-title { font-size:15px; font-weight:700; flex:1; }
        .task-badge {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.35);
            border-radius:99px; padding:5px 12px; font-size:12px;
            color:#a3e635; font-weight:700;
        }

        .page {
            position:relative; z-index:1;
            max-width:620px; margin:0 auto; padding:32px 20px 110px;
        }

        /* HERO */
        .hero {
            background:linear-gradient(135deg,rgba(124,58,237,.22),rgba(168,85,247,.14));
            border:1px solid rgba(124,58,237,.38); border-radius:24px;
            padding:36px 28px; margin-bottom:20px; text-align:center;
        }
        .hero-emoji { font-size:64px; margin-bottom:16px; display:block; }
        .hero h1 { font-size:26px; font-weight:800; line-height:1.25; margin-bottom:12px; }
        .hero p  { font-size:15px; line-height:1.7; opacity:.85; }

        /* CARDS */
        .card {
            background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
            border-radius:20px; padding:26px 24px; margin-bottom:16px;
        }
        .card-icon { font-size:28px; margin-bottom:10px; display:block; }
        .card h2   { font-size:17px; font-weight:800; margin-bottom:12px; }
        .card p    { font-size:14px; line-height:1.7; opacity:.82; }

        /* ШАГИ */
        .steps { display:flex; flex-direction:column; gap:0; }
        .step {
            display:flex; gap:16px; align-items:flex-start; padding:16px 0;
            border-bottom:1px solid rgba(255,255,255,.07);
        }
        .step:last-child { border-bottom:none; padding-bottom:0; }
        .step-num {
            width:32px; height:32px; border-radius:50%; flex-shrink:0;
            background:linear-gradient(135deg,#7c3aed,#a855f7);
            display:flex; align-items:center; justify-content:center;
            font-size:13px; font-weight:800; margin-top:1px;
        }
        .step-body { flex:1; }
        .step-title { font-size:14px; font-weight:700; margin-bottom:3px; }
        .step-desc  { font-size:13px; opacity:.7; line-height:1.5; }

        /* ПОПЫТКИ */
        .attempts-row {
            display:flex; gap:8px; margin-top:14px; justify-content:center;
        }
        .attempt-chip {
            display:flex; flex-direction:column; align-items:center; gap:4px;
            background:rgba(255,255,255,.06); border-radius:14px; padding:14px 18px;
            border:1px solid rgba(255,255,255,.1); flex:1;
        }
        .attempt-chip .num { font-size:22px; font-weight:800; color:#c4b5fd; }
        .attempt-chip .lbl { font-size:11px; opacity:.55; text-align:center; }
        .attempt-chip.highlight {
            background:rgba(132,204,22,.1); border-color:rgba(132,204,22,.3);
        }
        .attempt-chip.highlight .num { color:#a3e635; }

        /* ДНЕВНИК */
        .diary-preview {
            background:rgba(15,23,42,.5); border:1px solid rgba(255,255,255,.1);
            border-radius:16px; padding:20px; margin-top:14px;
        }
        .diary-row {
            display:flex; align-items:center; gap:12px;
            padding:10px 0; border-bottom:1px solid rgba(255,255,255,.06);
        }
        .diary-row:last-child { border-bottom:none; padding-bottom:0; }
        .diary-subject { flex:1; font-size:13px; opacity:.75; }
        .grade {
            width:36px; height:36px; border-radius:10px; flex-shrink:0;
            display:flex; align-items:center; justify-content:center;
            font-size:14px; font-weight:800;
        }
        .grade.five   { background:rgba(132,204,22,.2); color:#a3e635; border:1px solid rgba(132,204,22,.3); }
        .grade.four   { background:rgba(59,130,246,.2); color:#93c5fd; border:1px solid rgba(59,130,246,.3); }
        .grade.three  { background:rgba(245,158,11,.2); color:#fcd34d; border:1px solid rgba(245,158,11,.3); }
        .grade.new {
            animation:gradeAppear .6s ease both;
            background:linear-gradient(135deg,rgba(132,204,22,.3),rgba(101,163,13,.2));
            color:#a3e635; border:1px solid rgba(132,204,22,.4);
        }
        @keyframes gradeAppear {
            from { transform:scale(0); opacity:0; }
            to   { transform:scale(1); opacity:1; }
        }
        .diary-label { font-size:10px; color:#a3e635; font-weight:700;
                       background:rgba(132,204,22,.15); border-radius:99px;
                       padding:2px 8px; flex-shrink:0; }

        /* NOTE */
        .note {
            background:rgba(132,204,22,.08); border:1px solid rgba(132,204,22,.2);
            border-radius:14px; padding:14px 18px;
            display:flex; gap:12px; align-items:flex-start; margin-top:16px;
        }
        .note-icon { font-size:20px; flex-shrink:0; }
        .note-text { font-size:13px; line-height:1.55; opacity:.85; }

        /* DONE BUTTON */
        .done-wrap {
            position:fixed; bottom:0; left:0; right:0; z-index:40;
            padding:16px 20px 28px;
            background:linear-gradient(to top,#1a0840 65%,transparent);
        }
        .done-btn {
            display:block; width:100%; max-width:620px; margin:0 auto;
            padding:18px; border:none; border-radius:16px;
            font-size:16px; font-weight:800; cursor:pointer;
            background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
            transition:opacity .2s, transform .1s;
        }
        .done-btn:hover  { opacity:.9; transform:translateY(-1px); }
        .done-btn:active { transform:translateY(0); }
        .done-btn.done   {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.3);
            color:#a3e635; cursor:default; transform:none !important;
        }

                .done-two { display:flex; gap:10px; max-width:620px; margin:0 auto; }
        .btn-map  { padding:18px 16px; border:1px solid rgba(255,255,255,.2); border-radius:14px;
                    font-size:14px; font-weight:700; cursor:pointer;
                    background:rgba(255,255,255,.08); color:#fff; white-space:nowrap;
                    flex-shrink:0; transition:background .2s; }
        .btn-map:hover { background:rgba(255,255,255,.15); }
        .btn-nxt  { flex:1; padding:18px; border:none; border-radius:14px;
                    font-size:15px; font-weight:800; cursor:pointer;
                    background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
                    transition:opacity .2s, transform .1s; }
        .btn-nxt:hover  { opacity:.9; transform:translateY(-2px); }
        .btn-nxt:active { transform:translateY(0); }
        @keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:0; } }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="topbar">
    <a class="back-btn" href="index.html">← Назад</a>
    <div class="topbar-title">Приключение 6</div>
    <div class="task-badge">🧪 День 10</div>
</div>

<div class="page" id="page"></div>

<div class="done-wrap">
    <button class="done-btn" id="done-btn" onclick="markDone()">Первый тест пройден! →</button>
</div>

<script>
(function(){
    const c=document.getElementById('stars');
    for(let i=0;i<45;i++){
        const s=document.createElement('div'); s.className='star';
        const sz=Math.random()*2.5+.6;
        s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
        c.appendChild(s);
    }
})();

const profile  = JSON.parse(localStorage.getItem('oshka_profile')||'{}');
const name     = profile.name  || 'родитель';

const done     = JSON.parse(localStorage.getItem('oshka_done')||'[]');
const alreadyDone = done.includes(6);

document.getElementById('page').innerHTML = `

    <div class="hero">
        <span class="hero-emoji">🧪</span>
        <h1>Тесты и первые оценки</h1>
        <p>Пора проходить первые тесты и смотреть оценки в дневнике. Разберёмся как это работает — просто и по шагам.</p>
    </div>

    <div class="card">
        <span class="card-icon">🗺</span>
        <h2>Как найти и пройти тест</h2>
        <div class="steps">
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-body">
                    <div class="step-title">Открой нужный предмет в ЛК Ученика</div>
                    <div class="step-desc">Заходи в личный кабинет ученика и выбирай предмет</div>
                </div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-body">
                    <div class="step-title">Найди пройденную тему</div>
                    <div class="step-desc">В теме будут собраны все материалы: видеоурок, конспект, тест и задания для самопроверки</div>
                </div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-body">
                    <div class="step-title">Выбери тест и начни прохождение</div>
                    <div class="step-desc">Доступны тренировочные (без оценки) и контрольные (с оценкой) тесты</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <span class="card-icon">🔁</span>
        <h2>Сколько попыток?</h2>
        <p style="margin-bottom:14px">Не переживайте, если с первого раза не получилось — это нормально! Есть три попытки:</p>
        <div class="attempts-row">
            <div class="attempt-chip">
                <span class="num">1</span>
                <span class="lbl">Попытка</span>
            </div>
            <div class="attempt-chip">
                <span class="num">2</span>
                <span class="lbl">Попытка</span>
            </div>
            <div class="attempt-chip">
                <span class="num">3</span>
                <span class="lbl">Попытка</span>
            </div>
            <div class="attempt-chip highlight">
                <span class="num">⭐</span>
                <span class="lbl">Лучшая оценка будет засчитана</span>
            </div>
        </div>
    </div>

    <div class="card">
        <span class="card-icon">📓</span>
        <h2>Находим первую оценку в дневнике</h2>
        <p style="margin-bottom:4px">После прохождения теста оценка сразу появится в дневнике. Откройте его и найдите первую полученную оценку!</p>
        <div class="diary-preview">
            <div class="diary-row">
                <div class="diary-subject">Математика — Тест №1</div>
                <div class="grade four">4</div>
            </div>
            <div class="diary-row">
                <div class="diary-subject">Русский язык — Тест №1</div>
                <div class="grade three">3</div>
            </div>
            <div class="diary-row">
                <div class="diary-subject">Ваш первый тест</div>
                <div class="grade new">?</div>
                <div class="diary-label">Новая!</div>
            </div>
        </div>
        <div class="note">
            <div class="note-icon">💡</div>
            <div class="note-text">Дневник — главный экран для отслеживания прогресса. Загляните сюда после каждого теста.</div>
        </div>
    </div>
`;

if(alreadyDone){
    const btn = document.getElementById('done-btn');
    btn.textContent = '✓ Уже выполнено';
    btn.classList.add('done');
}

function markDone(){
    if(alreadyDone) return;
    const arr = JSON.parse(localStorage.getItem('oshka_done')||'[]');
    if(!arr.includes(6)) arr.push(6);
    localStorage.setItem('oshka_done', JSON.stringify(arr));
    confetti();
    setTimeout(()=>{
        document.getElementById('done-wrap').innerHTML=`<div class="done-two">
            <button class="btn-map" onclick="window.location.href='index.html'">← На карту</button>
            <button class="btn-nxt" onclick="window.location.href='task-7.html'">Следующее приключение →</button>
        </div>`;
    }, 900);
}

function confetti(){
    const colors=['#84cc16','#7c3aed','#f59e0b','#ec4899','#a3e635','#c084fc'];
    for(let i=0;i<28;i++){
        setTimeout(()=>{
            const el=document.createElement('div');
            el.style.cssText=`position:fixed;left:${10+Math.random()*80}%;top:-20px;
                width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                border-radius:${Math.random()>.5?'50%':'3px'};
                animation:fall ${1.2+Math.random()*1.8}s forwards;z-index:999;`;
            document.body.appendChild(el);
            setTimeout(()=>el.remove(),3500);
        },i*70);
    }
}

function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
