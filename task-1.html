<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать — Онлайн Школа №1</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
            background:linear-gradient(160deg,#1a0840 0%,#2d1b69 50%,#1a0840 100%);
            min-height:100vh; color:#fff;
        }
        .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .star  { position:absolute; background:#fff; border-radius:50%;
                 animation:twinkle var(--d,3s) infinite alternate; }
        @keyframes twinkle {
            0%  { opacity:.1; transform:scale(1); }
            100%{ opacity:.7; transform:scale(1.4); }
        }

        .topbar {
            position:sticky; top:0; z-index:50;
            background:rgba(26,8,64,.9); backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(255,255,255,.08);
            padding:14px 20px; display:flex; align-items:center; gap:12px;
        }
        .back-btn {
            display:flex; align-items:center; gap:6px;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
            border-radius:10px; padding:7px 13px; font-size:13px; font-weight:600;
            cursor:pointer; color:#fff; text-decoration:none; transition:background .2s;
        }
        .back-btn:hover { background:rgba(255,255,255,.16); }
        .topbar-title { font-size:15px; font-weight:700; flex:1; }
        .task-badge {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.35);
            border-radius:99px; padding:5px 12px; font-size:12px;
            color:#a3e635; font-weight:700;
        }

        .page {
            position:relative; z-index:1;
            max-width:620px; margin:0 auto; padding:32px 20px 110px;
        }

        /* HERO */
        .hero {
            background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(168,85,247,.15));
            border:1px solid rgba(124,58,237,.35); border-radius:24px;
            padding:34px 28px; margin-bottom:20px; text-align:center;
        }
        .hero-oshka { width:84px; height:86px; overflow:hidden; position:relative; margin:0 auto 18px; }
        .hero-oshka img { position:absolute; width:210px; top:-5px; left:-4px; }
        .hero h1 { font-size:27px; font-weight:800; line-height:1.25; margin-bottom:12px; }
        .hero h1 .name { color:#c4b5fd; }
        .hero p  { font-size:15px; line-height:1.7; opacity:.85; }

        /* CARDS */
        .card {
            background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
            border-radius:20px; padding:26px 24px; margin-bottom:16px;
        }
        .card-icon { font-size:30px; margin-bottom:12px; }
        .card h2   { font-size:17px; font-weight:800; margin-bottom:10px; }
        .card p    { font-size:14px; line-height:1.7; opacity:.82; }

        .card.philosophy {
            background:linear-gradient(135deg,rgba(132,204,22,.12),rgba(101,163,13,.08));
            border-color:rgba(132,204,22,.3);
        }
        .card.philosophy .quote {
            font-size:19px; font-weight:800; color:#a3e635;
            line-height:1.4; margin-bottom:10px;
        }

        /* DIRECTOR */
        .card.director { padding:0; overflow:hidden; }
        .dir-top {
            background:linear-gradient(135deg,rgba(124,58,237,.2),rgba(45,27,105,.4));
            padding:24px; display:flex; align-items:center; gap:18px;
        }
        .dir-photo {
            width:84px; height:84px; border-radius:50%;
            object-fit:cover; flex-shrink:0;
            border:3px solid rgba(124,58,237,.5);
        }
        .dir-name { font-size:19px; font-weight:800; }
        .dir-role { font-size:13px; color:#c4b5fd; margin-top:4px; }
        .dir-body { padding:22px 24px; }
        .dir-quote {
            border-left:3px solid #7c3aed; padding-left:16px;
            font-size:15px; line-height:1.75; opacity:.85; font-style:italic;
        }

        /* CURATOR */
        .card.curator { padding:0; overflow:hidden; }
        .cur-top {
            background:rgba(255,255,255,.05);
            padding:20px 24px; display:flex; align-items:center; gap:16px;
        }
        .cur-avatar {
            width:66px; height:66px; border-radius:50%; flex-shrink:0;
            background:linear-gradient(135deg,#7c3aed,#9333ea);
            display:flex; align-items:center; justify-content:center; font-size:28px;
        }
        .cur-name { font-size:17px; font-weight:800; }
        .cur-role { font-size:12px; color:#a3e635; margin-top:3px; font-weight:600; }
        .cur-body { padding:18px 24px 22px; }
        .cur-body p { font-size:14px; line-height:1.7; opacity:.82; margin-bottom:16px; }
        .cur-btn {
            display:inline-flex; align-items:center; gap:8px;
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.35);
            border-radius:10px; padding:11px 18px; font-size:13px; font-weight:700;
            color:#a3e635; cursor:pointer; transition:background .2s;
        }
        .cur-btn:hover { background:rgba(132,204,22,.25); }

        /* DONE BUTTON */
        .done-wrap {
            position:fixed; bottom:0; left:0; right:0; z-index:40;
            padding:16px 20px 28px;
            background:linear-gradient(to top,#1a0840 65%,transparent);
        }
        .done-btn {
            display:block; width:100%; max-width:620px; margin:0 auto;
            padding:18px; border:none; border-radius:16px;
            font-size:16px; font-weight:800; cursor:pointer;
            background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
            transition:opacity .2s, transform .1s;
        }
        .done-btn:hover  { opacity:.9; transform:translateY(-1px); }
        .done-btn:active { transform:translateY(0); }
        .done-btn.done   {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.3);
            color:#a3e635; cursor:default; transform:none !important;
        }

                .done-two { display:flex; gap:10px; max-width:620px; margin:0 auto; }
        .btn-map  { padding:18px 16px; border:1px solid rgba(255,255,255,.2); border-radius:14px;
                    font-size:14px; font-weight:700; cursor:pointer;
                    background:rgba(255,255,255,.08); color:#fff; white-space:nowrap;
                    flex-shrink:0; transition:background .2s; }
        .btn-map:hover { background:rgba(255,255,255,.15); }
        .btn-nxt  { flex:1; padding:18px; border:none; border-radius:14px;
                    font-size:15px; font-weight:800; cursor:pointer;
                    background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
                    transition:opacity .2s, transform .1s; }
        .btn-nxt:hover  { opacity:.9; transform:translateY(-2px); }
        .btn-nxt:active { transform:translateY(0); }
        @keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:0; } }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="topbar">
    <a class="back-btn" href="index.html">← Назад</a>
    <div class="topbar-title">Приключение 1</div>
    <div class="task-badge">👋 День 1</div>
</div>

<div class="page" id="page"></div>

<div class="done-wrap">
    <button class="done-btn" id="done-btn" onclick="markDone()">✓ Познакомился, идём дальше!</button>
</div>

<script>
// ── STARS ──
(function(){
    const c=document.getElementById('stars');
    for(let i=0;i<45;i++){
        const s=document.createElement('div'); s.className='star';
        const sz=Math.random()*2.5+.6;
        s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
        c.appendChild(s);
    }
})();

// ── ДАННЫЕ ──
const profile  = JSON.parse(localStorage.getItem('oshka_profile')||'{}');
const name     = profile.name  || 'родитель';

const done     = JSON.parse(localStorage.getItem('oshka_done')||'[]');
const alreadyDone = done.includes(1);

// ── РЕНДЕР ──
document.getElementById('page').innerHTML = `

    <div class="hero">
        <div class="hero-oshka"><img src="ошка.png" alt="Ошка"></div>
        <h1>Здравствуйте, <span class="name">${esc(name)}!</span></h1>
        <p>Рады приветствовать вас в Онлайн Школе №1. Мы готовы сделать это путешествие максимально комфортным для вас и вашего ребёнка.</p>
    </div>

    <div class="card philosophy">
        <div class="quote">«Мы делаем образование качественным и доступным в любой точке мира»</div>
        <p>Неважно где вы находитесь — ваш ребёнок получает живых учителей, настоящее общение и реальные знания.</p>
    </div>

    <div class="card">
        <div class="card-icon">🗺</div>
        <h2>Зачем этот сайт?</h2>
        <p>Этот сайт создан специально для вас. За 30 дней вы шаг за шагом разберётесь как устроено обучение, познакомитесь с командой и будете чувствовать себя уверенно на каждом этапе.</p>
    </div>

    <div class="card director">
        <div class="dir-top">
            <img class="dir-photo" src="Егор.jpeg" alt="Егор Сорокин">
            <div>
                <div class="dir-name">Егор Сорокин</div>
                <div class="dir-role">Основатель Онлайн Школы №1</div>
            </div>
        </div>
        <div class="dir-body">
            <p class="dir-quote">Привет! Я Егор, основатель Школы №1. Рад, что вы с нами — мы вложили душу в каждую деталь, чтобы ваш ребёнок учился с удовольствием, а вы всегда были в курсе. Если что-то непонятно — мы рядом!</p>
        </div>
    </div>

    <div class="card curator">
        <div class="cur-top">
            <div class="cur-avatar">👩‍🏫</div>
            <div>
                <div class="cur-name">Ваш куратор</div>
                <div class="cur-role">Личный помощник</div>
            </div>
        </div>
        <div class="cur-body">
            <p>Это ваш личный помощник в школе. Куратор отвечает на вопросы, следит за прогрессом вашего ребёнка и всегда на связи.</p>
            <span class="cur-btn">📩 Написать куратору</span>
        </div>
    </div>
`;

if(alreadyDone){
    const btn = document.getElementById('done-btn');
    btn.textContent = '✓ Уже выполнено';
    btn.classList.add('done');
}

function markDone(){
    if(alreadyDone) return;
    const arr = JSON.parse(localStorage.getItem('oshka_done')||'[]');
    if(!arr.includes(1)) arr.push(1);
    localStorage.setItem('oshka_done', JSON.stringify(arr));
    confetti();
    setTimeout(()=>{
        document.getElementById('done-wrap').innerHTML=`<div class="done-two">
            <button class="btn-map" onclick="window.location.href='index.html'">← На карту</button>
            <button class="btn-nxt" onclick="window.location.href='task-2.html'">Следующее приключение →</button>
        </div>`;
    }, 900);
}

function confetti(){
    const colors=['#84cc16','#7c3aed','#f59e0b','#ec4899','#a3e635','#c084fc'];
    for(let i=0;i<28;i++){
        setTimeout(()=>{
            const el=document.createElement('div');
            el.style.cssText=`position:fixed;left:${10+Math.random()*80}%;top:-20px;
                width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                border-radius:${Math.random()>.5?'50%':'3px'};
                animation:fall ${1.2+Math.random()*1.8}s forwards;z-index:999;`;
            document.body.appendChild(el);
            setTimeout(()=>el.remove(),3500);
        },i*70);
    }
}

function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
