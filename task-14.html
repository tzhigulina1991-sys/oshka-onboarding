<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила аттестации — Онлайн Школа №1</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
            background:linear-gradient(160deg,#1a0840 0%,#2d1b69 50%,#1a0840 100%);
            min-height:100vh; color:#fff;
        }
        .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .star  { position:absolute; background:#fff; border-radius:50%;
                 animation:twinkle var(--d,3s) infinite alternate; }
        @keyframes twinkle {
            0%  { opacity:.1; transform:scale(1); }
            100%{ opacity:.7; transform:scale(1.4); }
        }
        .topbar {
            position:sticky; top:0; z-index:50;
            background:rgba(26,8,64,.9); backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(255,255,255,.08);
            padding:14px 20px; display:flex; align-items:center; gap:12px;
        }
        .back-btn {
            display:flex; align-items:center; gap:6px;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
            border-radius:10px; padding:7px 13px; font-size:13px; font-weight:600;
            cursor:pointer; color:#fff; text-decoration:none; transition:background .2s;
        }
        .back-btn:hover { background:rgba(255,255,255,.16); }
        .topbar-title { font-size:15px; font-weight:700; flex:1; }
        .task-badge {
            background:rgba(251,191,36,.15); border:1px solid rgba(251,191,36,.35);
            border-radius:99px; padding:5px 12px; font-size:12px;
            color:#fcd34d; font-weight:700;
        }
        .page {
            position:relative; z-index:1;
            max-width:620px; margin:0 auto; padding:32px 20px 110px;
        }

        /* HERO */
        .hero {
            background:linear-gradient(135deg,rgba(220,38,38,.2),rgba(185,28,28,.12));
            border:1px solid rgba(248,113,113,.3); border-radius:24px;
            padding:36px 28px; margin-bottom:20px; text-align:center;
        }
        .hero-emoji { font-size:64px; margin-bottom:16px; display:block; }
        .hero h1 { font-size:26px; font-weight:800; line-height:1.25; margin-bottom:12px; }
        .hero p  { font-size:15px; line-height:1.7; opacity:.85; }

        .card {
            background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
            border-radius:20px; padding:26px 24px; margin-bottom:16px;
        }
        .card-icon { font-size:28px; margin-bottom:10px; display:block; }
        .card h2   { font-size:17px; font-weight:800; margin-bottom:12px; }
        .card p    { font-size:14px; line-height:1.7; opacity:.82; }

        /* ОДНА ПОПЫТКА — большой алерт */
        .one-attempt {
            background:rgba(220,38,38,.1); border:2px solid rgba(248,113,113,.4);
            border-radius:20px; padding:24px; margin-bottom:16px; text-align:center;
        }
        .one-attempt-icon  { font-size:48px; margin-bottom:12px; display:block; }
        .one-attempt-title { font-size:20px; font-weight:900; color:#fca5a5; margin-bottom:8px; }
        .one-attempt-sub   { font-size:14px; line-height:1.65; opacity:.8; }

        /* ВРЕМЯ */
        .time-row { display:flex; gap:10px; margin-top:4px; }
        .time-chip {
            flex:1; border-radius:16px; padding:18px 14px; text-align:center;
            background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
        }
        .time-chip-icon  { font-size:28px; margin-bottom:8px; display:block; }
        .time-chip-name  { font-size:12px; font-weight:700; color:#fcd34d; margin-bottom:6px; text-transform:uppercase; letter-spacing:.4px; }
        .time-chip-value { font-size:13px; opacity:.7; line-height:1.45; }
        .time-placeholder { font-size:12px; color:rgba(253,211,77,.6); font-style:italic; }

        /* ТРЕБОВАНИЯ К ФОТО */
        .req-list { display:flex; flex-direction:column; gap:10px; margin-top:4px; }
        .req-item {
            display:flex; gap:12px; align-items:flex-start;
            background:rgba(255,255,255,.04); border-radius:14px;
            padding:13px 16px; border:1px solid rgba(255,255,255,.07);
        }
        .req-item-icon  { font-size:22px; flex-shrink:0; }
        .req-item-text  { flex:1; font-size:13px; line-height:1.5; opacity:.8; }
        .req-item-text strong { display:block; font-size:13px; font-weight:700; margin-bottom:2px; opacity:1; }

        .tip {
            background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.2);
            border-radius:14px; padding:14px 18px; margin-top:16px;
            display:flex; gap:12px; align-items:flex-start;
        }
        .tip-icon { font-size:20px; flex-shrink:0; }
        .tip-text { font-size:13px; line-height:1.55; opacity:.85; }

        .done-wrap {
            position:fixed; bottom:0; left:0; right:0; z-index:40;
            padding:16px 20px 28px;
            background:linear-gradient(to top,#1a0840 65%,transparent);
        }
        .done-btn {
            display:block; width:100%; max-width:620px; margin:0 auto;
            padding:18px; border:none; border-radius:16px;
            font-size:16px; font-weight:800; cursor:pointer;
            background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
            transition:opacity .2s, transform .1s;
        }
        .done-btn:hover  { opacity:.9; transform:translateY(-1px); }
        .done-btn:active { transform:translateY(0); }
        .done-btn.done {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.3);
            color:#a3e635; cursor:default; transform:none !important;
        }
                .done-two { display:flex; gap:10px; max-width:620px; margin:0 auto; }
        .btn-map  { padding:18px 16px; border:1px solid rgba(255,255,255,.2); border-radius:14px;
                    font-size:14px; font-weight:700; cursor:pointer;
                    background:rgba(255,255,255,.08); color:#fff; white-space:nowrap;
                    flex-shrink:0; transition:background .2s; }
        .btn-map:hover { background:rgba(255,255,255,.15); }
        .btn-nxt  { flex:1; padding:18px; border:none; border-radius:14px;
                    font-size:15px; font-weight:800; cursor:pointer;
                    background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
                    transition:opacity .2s, transform .1s; }
        .btn-nxt:hover  { opacity:.9; transform:translateY(-2px); }
        .btn-nxt:active { transform:translateY(0); }
        @keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:0; } }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="topbar">
    <a class="back-btn" href="index.html">← Назад</a>
    <div class="topbar-title">Приключение 14</div>
    <div class="task-badge">⚠️ Аттестация</div>
</div>
<div class="page" id="page"></div>
<div class="done-wrap">
    <button class="done-btn" id="done-btn" onclick="markDone()">Правила изучены! →</button>
</div>
<script>
(function(){
    const c=document.getElementById('stars');
    for(let i=0;i<45;i++){
        const s=document.createElement('div'); s.className='star';
        const sz=Math.random()*2.5+.6;
        s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
        c.appendChild(s);
    }
})();

const done      = JSON.parse(localStorage.getItem('oshka_done')||'[]');
const alreadyDone = done.includes(14);

document.getElementById('page').innerHTML = `

    <div class="hero">
        <span class="hero-emoji">⚠️</span>
        <h1>Важные правила аттестации</h1>
        <p>Прочитайте внимательно — эти правила отличаются от обычных домашних заданий. Здесь всё немного строже.</p>
    </div>

    <div class="one-attempt">
        <span class="one-attempt-icon">🎯</span>
        <div class="one-attempt-title">Одна попытка</div>
        <div class="one-attempt-sub">На аттестационные работы даётся только одна попытка.<br>Пересдача <strong>не предусмотрена</strong> — важно быть готовым заранее.</div>
    </div>

    <div class="card">
        <span class="card-icon">⏱</span>
        <h2>Время на прохождение</h2>
        <p style="margin-bottom:14px">Обратите внимание на таймер при прохождении ФТ (финального теста) и КР (контрольной работы):</p>
        <div class="time-row">
            <div class="time-chip">
                <span class="time-chip-icon">📝</span>
                <div class="time-chip-name">Контрольная работа</div>
                <div class="time-chip-value"><span class="time-placeholder">уточните у куратора</span></div>
            </div>
            <div class="time-chip">
                <span class="time-chip-icon">🧪</span>
                <div class="time-chip-name">Финальный тест</div>
                <div class="time-chip-value"><span class="time-placeholder">уточните у куратора</span></div>
            </div>
        </div>
        <div class="tip">
            <div class="tip-icon">💡</div>
            <div class="tip-text">Таймер запускается в момент открытия работы. Убедитесь, что у ребёнка есть достаточно времени, прежде чем начинать.</div>
        </div>
    </div>

    <div class="card">
        <span class="card-icon">📸</span>
        <h2>Требования к письменным работам</h2>
        <div class="req-list">
            <div class="req-item">
                <div class="req-item-icon">✍️</div>
                <div class="req-item-text">
                    <strong>Только от руки</strong>
                    Печатный текст и распечатки не принимаются — работа должна быть написана собственноручно
                </div>
            </div>
            <div class="req-item">
                <div class="req-item-icon">🔆</div>
                <div class="req-item-text">
                    <strong>Светлые и чёткие фото</strong>
                    Хорошее освещение, текст полностью читаем, без размытия и теней
                </div>
            </div>
            <div class="req-item">
                <div class="req-item-icon">🖼</div>
                <div class="req-item-text">
                    <strong>Без посторонних предметов на фоне</strong>
                    Снимайте только лист с работой — стол, кружки, телефоны и другие предметы не должны попадать в кадр
                </div>
            </div>
            <div class="req-item">
                <div class="req-item-icon">📄</div>
                <div class="req-item-text">
                    <strong>Формат PDF</strong>
                    Перед загрузкой конвертируйте фото через iLovePDF — как и обычные домашние работы
                </div>
            </div>
        </div>
    </div>
`;

if(alreadyDone){
    const btn = document.getElementById('done-btn');
    btn.textContent = '✓ Уже выполнено';
    btn.classList.add('done');
}

function markDone(){
    if(alreadyDone) return;
    const arr = JSON.parse(localStorage.getItem('oshka_done')||'[]');
    if(!arr.includes(14)) arr.push(14);
    localStorage.setItem('oshka_done', JSON.stringify(arr));
    confetti();
    setTimeout(()=>{
        document.getElementById('done-wrap').innerHTML=`<div class="done-two">
            <button class="btn-map" onclick="window.location.href='index.html'">← На карту</button>
            <button class="btn-nxt" onclick="window.location.href='task-15.html'">Следующее приключение →</button>
        </div>`;
    }, 900);
}

function confetti(){
    const colors=['#84cc16','#7c3aed','#f59e0b','#fca5a5','#a3e635','#fdba74'];
    for(let i=0;i<28;i++){
        setTimeout(()=>{
            const el=document.createElement('div');
            el.style.cssText=`position:fixed;left:${10+Math.random()*80}%;top:-20px;
                width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                border-radius:${Math.random()>.5?'50%':'3px'};
                animation:fall ${1.2+Math.random()*1.8}s forwards;z-index:999;`;
            document.body.appendChild(el);
            setTimeout(()=>el.remove(),3500);
        },i*70);
    }
}

function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
