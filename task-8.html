<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Письменные домашки — Онлайн Школа №1</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
            background:linear-gradient(160deg,#1a0840 0%,#2d1b69 50%,#1a0840 100%);
            min-height:100vh; color:#fff;
        }
        .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .star  { position:absolute; background:#fff; border-radius:50%;
                 animation:twinkle var(--d,3s) infinite alternate; }
        @keyframes twinkle {
            0%  { opacity:.1; transform:scale(1); }
            100%{ opacity:.7; transform:scale(1.4); }
        }

        .topbar {
            position:sticky; top:0; z-index:50;
            background:rgba(26,8,64,.9); backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(255,255,255,.08);
            padding:14px 20px; display:flex; align-items:center; gap:12px;
        }
        .back-btn {
            display:flex; align-items:center; gap:6px;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
            border-radius:10px; padding:7px 13px; font-size:13px; font-weight:600;
            cursor:pointer; color:#fff; text-decoration:none; transition:background .2s;
        }
        .back-btn:hover { background:rgba(255,255,255,.16); }
        .topbar-title { font-size:15px; font-weight:700; flex:1; }
        .task-badge {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.35);
            border-radius:99px; padding:5px 12px; font-size:12px;
            color:#a3e635; font-weight:700;
        }

        .page {
            position:relative; z-index:1;
            max-width:620px; margin:0 auto; padding:32px 20px 110px;
        }

        /* HERO */
        .hero {
            background:linear-gradient(135deg,rgba(234,88,12,.18),rgba(194,65,12,.1));
            border:1px solid rgba(251,146,60,.3); border-radius:24px;
            padding:36px 28px; margin-bottom:20px; text-align:center;
        }
        .hero-emoji { font-size:64px; margin-bottom:16px; display:block; }
        .hero h1 { font-size:26px; font-weight:800; line-height:1.25; margin-bottom:12px; }
        .hero p  { font-size:15px; line-height:1.7; opacity:.85; }

        /* CARDS */
        .card {
            background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
            border-radius:20px; padding:26px 24px; margin-bottom:16px;
        }
        .card-icon { font-size:28px; margin-bottom:10px; display:block; }
        .card h2   { font-size:17px; font-weight:800; margin-bottom:12px; }
        .card p    { font-size:14px; line-height:1.7; opacity:.82; }

        /* ВАЖНО — ЛК */
        .alert-card {
            background:rgba(239,68,68,.1); border:1.5px solid rgba(239,68,68,.35);
            border-radius:20px; padding:22px 24px; margin-bottom:16px;
        }
        .alert-card h2 { font-size:17px; font-weight:800; margin-bottom:12px; color:#fca5a5; }
        .access-row {
            display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;
        }
        .access-chip {
            display:flex; align-items:center; gap:6px;
            border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600;
            flex:1; min-width:130px;
        }
        .access-chip.ok  { background:rgba(132,204,22,.12); border:1px solid rgba(132,204,22,.3); color:#a3e635; }
        .access-chip.no  { background:rgba(239,68,68,.1);   border:1px solid rgba(239,68,68,.3);  color:#fca5a5; }
        .access-chip-icon { font-size:18px; }

        /* ШАГИ ЗАГРУЗКИ */
        .steps { display:flex; flex-direction:column; gap:0; }
        .step {
            display:flex; gap:16px; align-items:flex-start; padding:16px 0;
            border-bottom:1px solid rgba(255,255,255,.07);
        }
        .step:last-child { border-bottom:none; padding-bottom:0; }
        .step-num {
            width:32px; height:32px; border-radius:50%; flex-shrink:0;
            background:linear-gradient(135deg,#ea580c,#c2410c);
            display:flex; align-items:center; justify-content:center;
            font-size:13px; font-weight:800; margin-top:1px;
        }
        .step-body { flex:1; }
        .step-title { font-size:14px; font-weight:700; margin-bottom:3px; }
        .step-desc  { font-size:13px; opacity:.7; line-height:1.5; }
        .step-link {
            display:inline-flex; align-items:center; gap:5px; margin-top:6px;
            background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15);
            border-radius:8px; padding:6px 12px; font-size:12px; font-weight:600;
            color:#fff; text-decoration:none; transition:background .2s;
        }
        .step-link:hover { background:rgba(255,255,255,.14); }

        /* ТРЕБОВАНИЯ К ФОТО */
        .req-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
        .req-item {
            background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
            border-radius:14px; padding:14px; text-align:center;
        }
        .req-item-icon { font-size:24px; margin-bottom:6px; display:block; }
        .req-item-text { font-size:12px; line-height:1.45; opacity:.75; }

        /* СРОК ПРОВЕРКИ */
        .deadline-wrap {
            display:flex; align-items:center; gap:20px; margin-top:4px;
        }
        .deadline-num {
            font-size:52px; font-weight:900; color:#fdba74; line-height:1; flex-shrink:0;
        }
        .deadline-info { flex:1; }
        .deadline-title { font-size:15px; font-weight:700; margin-bottom:4px; }
        .deadline-sub   { font-size:13px; opacity:.65; line-height:1.5; }

        /* NOTE */
        .note {
            background:rgba(132,204,22,.08); border:1px solid rgba(132,204,22,.2);
            border-radius:14px; padding:14px 18px;
            display:flex; gap:12px; align-items:flex-start; margin-top:16px;
        }
        .note-icon { font-size:20px; flex-shrink:0; }
        .note-text { font-size:13px; line-height:1.55; opacity:.85; }

        /* DONE BUTTON */
        .done-wrap {
            position:fixed; bottom:0; left:0; right:0; z-index:40;
            padding:16px 20px 28px;
            background:linear-gradient(to top,#1a0840 65%,transparent);
        }
        .done-btn {
            display:block; width:100%; max-width:620px; margin:0 auto;
            padding:18px; border:none; border-radius:16px;
            font-size:16px; font-weight:800; cursor:pointer;
            background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
            transition:opacity .2s, transform .1s;
        }
        .done-btn:hover  { opacity:.9; transform:translateY(-1px); }
        .done-btn:active { transform:translateY(0); }
        .done-btn.done   {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.3);
            color:#a3e635; cursor:default; transform:none !important;
        }

                .done-two { display:flex; gap:10px; max-width:620px; margin:0 auto; }
        .btn-map  { padding:18px 16px; border:1px solid rgba(255,255,255,.2); border-radius:14px;
                    font-size:14px; font-weight:700; cursor:pointer;
                    background:rgba(255,255,255,.08); color:#fff; white-space:nowrap;
                    flex-shrink:0; transition:background .2s; }
        .btn-map:hover { background:rgba(255,255,255,.15); }
        .btn-nxt  { flex:1; padding:18px; border:none; border-radius:14px;
                    font-size:15px; font-weight:800; cursor:pointer;
                    background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
                    transition:opacity .2s, transform .1s; }
        .btn-nxt:hover  { opacity:.9; transform:translateY(-2px); }
        .btn-nxt:active { transform:translateY(0); }
        @keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:0; } }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="topbar">
    <a class="back-btn" href="index.html">← Назад</a>
    <div class="topbar-title">Приключение 8</div>
    <div class="task-badge">📤 День 20</div>
</div>

<div class="page" id="page"></div>

<div class="done-wrap">
    <button class="done-btn" id="done-btn" onclick="markDone()">Всё понятно! Сдаём работу →</button>
</div>

<script>
(function(){
    const c=document.getElementById('stars');
    for(let i=0;i<45;i++){
        const s=document.createElement('div'); s.className='star';
        const sz=Math.random()*2.5+.6;
        s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
        c.appendChild(s);
    }
})();

const profile  = JSON.parse(localStorage.getItem('oshka_profile')||'{}');

const done     = JSON.parse(localStorage.getItem('oshka_done')||'[]');
const alreadyDone = done.includes(8);

document.getElementById('page').innerHTML = `

    <div class="hero">
        <span class="hero-emoji">📤</span>
        <h1>Письменные домашки</h1>
        <p>Разбираемся как правильно загрузить письменную работу, чтобы она дошла до учителя и была проверена вовремя.</p>
    </div>

    <div class="alert-card">
        <h2>⚠️ Только через ЛК Ученика</h2>
        <div class="access-row">
            <div class="access-chip ok">
                <span class="access-chip-icon">✅</span>
                ЛК Ученика
            </div>
            <div class="access-chip no">
                <span class="access-chip-icon">🚫</span>
                ЛК Родителя
            </div>
        </div>
        <div class="access-row">
            <div class="access-chip no">
                <span class="access-chip-icon">🚫</span>
                ЛК Куратора
            </div>
            <div class="access-chip no">
                <span class="access-chip-icon">🚫</span>
                ЛК Администратора
            </div>
        </div>
    </div>

    <div class="card">
        <span class="card-icon">📋</span>
        <h2>Как загрузить работу — пошагово</h2>
        <div class="steps">
            <div class="step">
                <div class="step-num">1</div>
                <div class="step-body">
                    <div class="step-title">Выполни работу от руки</div>
                    <div class="step-desc">Письменные задания пишутся на бумаге — распечатки или печатный текст не принимаются</div>
                </div>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <div class="step-body">
                    <div class="step-title">Сфотографируй чётко, без лишнего фона</div>
                    <div class="step-desc">Текст должен быть хорошо виден, страница прямая, без теней и мятых краёв</div>
                </div>
            </div>
            <div class="step">
                <div class="step-num">3</div>
                <div class="step-body">
                    <div class="step-title">Конвертируй фото в PDF</div>
                    <div class="step-desc">Задания принимаются только в формате PDF. Используй бесплатный сервис:</div>
                    <a class="step-link" href="https://www.ilovepdf.com/ru/jpg_to_pdf" target="_blank">🔗 iLovePDF — конвертировать фото в PDF</a>
                </div>
            </div>
            <div class="step">
                <div class="step-num">4</div>
                <div class="step-body">
                    <div class="step-title">Загрузи через ЛК Ученика</div>
                    <div class="step-desc">Зайди в дневник или план дня → найди задание → нажми «Загрузить работу» → прикрепи PDF</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <span class="card-icon">📸</span>
        <h2>Требования к фото работы</h2>
        <div class="req-grid">
            <div class="req-item">
                <span class="req-item-icon">✍️</span>
                <div class="req-item-text">Написано от руки, разборчиво</div>
            </div>
            <div class="req-item">
                <span class="req-item-icon">🔆</span>
                <div class="req-item-text">Хорошее освещение, текст чётко виден</div>
            </div>
            <div class="req-item">
                <span class="req-item-icon">🖼</span>
                <div class="req-item-text">Без лишнего фона — только лист</div>
            </div>
            <div class="req-item">
                <span class="req-item-icon">📐</span>
                <div class="req-item-text">Страница прямая, без перекосов</div>
            </div>
        </div>
    </div>

    <div class="card">
        <span class="card-icon">⏳</span>
        <h2>Срок проверки</h2>
        <div class="deadline-wrap">
            <div class="deadline-num">4</div>
            <div class="deadline-info">
                <div class="deadline-title">рабочих дня</div>
                <div class="deadline-sub">После загрузки работы учитель проверит её в течение 4 рабочих дней. Оценка появится в дневнике автоматически.</div>
            </div>
        </div>
        <div class="note">
            <div class="note-icon">💡</div>
            <div class="note-text">Если оценка не появилась — напишите куратору, он поможет разобраться.</div>
        </div>
    </div>
`;

if(alreadyDone){
    const btn = document.getElementById('done-btn');
    btn.textContent = '✓ Уже выполнено';
    btn.classList.add('done');
}

function markDone(){
    if(alreadyDone) return;
    const arr = JSON.parse(localStorage.getItem('oshka_done')||'[]');
    if(!arr.includes(8)) arr.push(8);
    localStorage.setItem('oshka_done', JSON.stringify(arr));
    confetti();
    setTimeout(()=>{
        document.getElementById('done-wrap').innerHTML=`<div class="done-two">
            <button class="btn-map" onclick="window.location.href='index.html'">← На карту</button>
            <button class="btn-nxt" onclick="window.location.href='task-9.html'">Следующее приключение →</button>
        </div>`;
    }, 900);
}

function confetti(){
    const colors=['#84cc16','#7c3aed','#f59e0b','#ec4899','#a3e635','#fdba74'];
    for(let i=0;i<28;i++){
        setTimeout(()=>{
            const el=document.createElement('div');
            el.style.cssText=`position:fixed;left:${10+Math.random()*80}%;top:-20px;
                width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                border-radius:${Math.random()>.5?'50%':'3px'};
                animation:fall ${1.2+Math.random()*1.8}s forwards;z-index:999;`;
            document.body.appendChild(el);
            setTimeout(()=>el.remove(),3500);
        },i*70);
    }
}

function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
