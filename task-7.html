<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Самопроверка — Онлайн Школа №1</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
            background:linear-gradient(160deg,#1a0840 0%,#2d1b69 50%,#1a0840 100%);
            min-height:100vh; color:#fff;
        }
        .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .star  { position:absolute; background:#fff; border-radius:50%;
                 animation:twinkle var(--d,3s) infinite alternate; }
        @keyframes twinkle {
            0%  { opacity:.1; transform:scale(1); }
            100%{ opacity:.7; transform:scale(1.4); }
        }

        .topbar {
            position:sticky; top:0; z-index:50;
            background:rgba(26,8,64,.9); backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(255,255,255,.08);
            padding:14px 20px; display:flex; align-items:center; gap:12px;
        }
        .back-btn {
            display:flex; align-items:center; gap:6px;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
            border-radius:10px; padding:7px 13px; font-size:13px; font-weight:600;
            cursor:pointer; color:#fff; text-decoration:none; transition:background .2s;
        }
        .back-btn:hover { background:rgba(255,255,255,.16); }
        .topbar-title { font-size:15px; font-weight:700; flex:1; }
        .task-badge {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.35);
            border-radius:99px; padding:5px 12px; font-size:12px;
            color:#a3e635; font-weight:700;
        }

        .page {
            position:relative; z-index:1;
            max-width:620px; margin:0 auto; padding:32px 20px 110px;
        }

        /* HERO */
        .hero {
            background:linear-gradient(135deg,rgba(14,165,233,.18),rgba(2,132,199,.1));
            border:1px solid rgba(14,165,233,.3); border-radius:24px;
            padding:36px 28px; margin-bottom:20px; text-align:center;
        }
        .hero-emoji { font-size:64px; margin-bottom:16px; display:block; }
        .hero h1 { font-size:26px; font-weight:800; line-height:1.25; margin-bottom:12px; }
        .hero p  { font-size:15px; line-height:1.7; opacity:.85; }

        /* CARDS */
        .card {
            background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
            border-radius:20px; padding:26px 24px; margin-bottom:16px;
        }
        .card-icon { font-size:28px; margin-bottom:10px; display:block; }
        .card h2   { font-size:17px; font-weight:800; margin-bottom:12px; }
        .card p    { font-size:14px; line-height:1.7; opacity:.82; }

        /* КАК НАЙТИ */
        .path-steps { display:flex; align-items:center; gap:6px;
                      flex-wrap:wrap; margin:14px 0; }
        .path-step {
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
            border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600;
            white-space:nowrap;
        }
        .path-arrow { font-size:14px; opacity:.4; flex-shrink:0; }

        /* ПРЕИМУЩЕСТВА */
        .benefits { display:flex; flex-direction:column; gap:10px; margin-top:4px; }
        .benefit {
            display:flex; align-items:flex-start; gap:12px;
            padding:14px 16px; border-radius:14px;
            background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07);
        }
        .benefit-icon { font-size:22px; flex-shrink:0; }
        .benefit-text { flex:1; font-size:13px; line-height:1.55; opacity:.8; }
        .benefit-text strong { display:block; font-size:13px; font-weight:700; margin-bottom:3px; opacity:1; }

        /* ДЕЖУРНЫЕ УЧИТЕЛЯ */
        .duty-card {
            background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.25);
            border-radius:20px; padding:22px 24px; margin-bottom:16px;
        }
        .duty-card h2 { font-size:17px; font-weight:800; margin-bottom:8px; }
        .duty-card > p { font-size:14px; line-height:1.7; opacity:.82; margin-bottom:16px; }
        .duty-list { display:flex; flex-direction:column; gap:9px; }
        .duty-item {
            display:flex; align-items:center; gap:12px;
            background:rgba(255,255,255,.05); border-radius:13px; padding:13px 16px;
            border:1px solid rgba(255,255,255,.08);
        }
        .duty-item-icon { font-size:20px; flex-shrink:0; }
        .duty-item-label { font-size:11px; opacity:.5; text-transform:uppercase;
                           letter-spacing:.4px; font-weight:700; margin-bottom:3px; }
        .duty-item-value { font-size:14px; font-weight:600; }
        .duty-placeholder {
            color:rgba(253,186,116,.7); font-style:italic;
        }

        /* DONE BUTTON */
        .done-wrap {
            position:fixed; bottom:0; left:0; right:0; z-index:40;
            padding:16px 20px 28px;
            background:linear-gradient(to top,#1a0840 65%,transparent);
        }
        .done-btn {
            display:block; width:100%; max-width:620px; margin:0 auto;
            padding:18px; border:none; border-radius:16px;
            font-size:16px; font-weight:800; cursor:pointer;
            background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
            transition:opacity .2s, transform .1s;
        }
        .done-btn:hover  { opacity:.9; transform:translateY(-1px); }
        .done-btn:active { transform:translateY(0); }
        .done-btn.done   {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.3);
            color:#a3e635; cursor:default; transform:none !important;
        }

                .done-two { display:flex; gap:10px; max-width:620px; margin:0 auto; }
        .btn-map  { padding:18px 16px; border:1px solid rgba(255,255,255,.2); border-radius:14px;
                    font-size:14px; font-weight:700; cursor:pointer;
                    background:rgba(255,255,255,.08); color:#fff; white-space:nowrap;
                    flex-shrink:0; transition:background .2s; }
        .btn-map:hover { background:rgba(255,255,255,.15); }
        .btn-nxt  { flex:1; padding:18px; border:none; border-radius:14px;
                    font-size:15px; font-weight:800; cursor:pointer;
                    background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
                    transition:opacity .2s, transform .1s; }
        .btn-nxt:hover  { opacity:.9; transform:translateY(-2px); }
        .btn-nxt:active { transform:translateY(0); }
        @keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:0; } }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="topbar">
    <a class="back-btn" href="index.html">← Назад</a>
    <div class="topbar-title">Приключение 7</div>
    <div class="task-badge">✏️ День 14</div>
</div>

<div class="page" id="page"></div>

<div class="done-wrap">
    <button class="done-btn" id="done-btn" onclick="markDone()">Понятно! Идём дальше →</button>
</div>

<script>
(function(){
    const c=document.getElementById('stars');
    for(let i=0;i<45;i++){
        const s=document.createElement('div'); s.className='star';
        const sz=Math.random()*2.5+.6;
        s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
        c.appendChild(s);
    }
})();

const profile  = JSON.parse(localStorage.getItem('oshka_profile')||'{}');

const done     = JSON.parse(localStorage.getItem('oshka_done')||'[]');
const alreadyDone = done.includes(7);

document.getElementById('page').innerHTML = `

    <div class="hero">
        <span class="hero-emoji">✏️</span>
        <h1>Задания для самопроверки</h1>
        <p>Ещё один формат работы в школе — задания для самопроверки. Они помогают закрепить тему в своём темпе, без стресса и оценок.</p>
    </div>

    <div class="card">
        <span class="card-icon">🔍</span>
        <h2>Где найти задания</h2>
        <p>Задания для самопроверки находятся внутри каждой темы предмета — рядом с видеоуроком и тестами:</p>
        <div class="path-steps">
            <div class="path-step">📚 Предмет</div>
            <div class="path-arrow">→</div>
            <div class="path-step">📖 Тема</div>
            <div class="path-arrow">→</div>
            <div class="path-step">✏️ Самопроверка</div>
        </div>
        <div class="benefits">
            <div class="benefit">
                <div class="benefit-icon">🆓</div>
                <div class="benefit-text">
                    <strong>Не нужно отправлять на проверку</strong>
                    Выполняешь сам и сразу проверяешь — куратору ничего отправлять не надо
                </div>
            </div>
            <div class="benefit">
                <div class="benefit-icon">🔄</div>
                <div class="benefit-text">
                    <strong>Можно повторить в любое время</strong>
                    Отличный способ подготовиться к контрольному тесту или повторить пройденное
                </div>
            </div>
            <div class="benefit">
                <div class="benefit-icon">📈</div>
                <div class="benefit-text">
                    <strong>Не влияет на оценки</strong>
                    Можно пробовать, ошибаться и учиться без давления
                </div>
            </div>
        </div>
    </div>

    <div class="duty-card">
        <span class="card-icon">🧑‍🏫</span>
        <h2>Остались вопросы по теме?</h2>
        <p>Если что-то не получается или осталось непонятным — смело пишите дежурным учителям! Они всегда готовы помочь разобраться с любой темой.</p>
        <div class="duty-list">
            <div class="duty-item">
                <div class="duty-item-icon">🕐</div>
                <div>
                    <div class="duty-item-label">График работы</div>
                    <div class="duty-item-value duty-placeholder">— уточните у куратора —</div>
                </div>
            </div>
            <div class="duty-item">
                <div class="duty-item-icon">💬</div>
                <div>
                    <div class="duty-item-label">Как написать</div>
                    <div class="duty-item-value duty-placeholder">— ссылка на чат дежурных —</div>
                </div>
            </div>
        </div>
    </div>
`;

if(alreadyDone){
    const btn = document.getElementById('done-btn');
    btn.textContent = '✓ Уже выполнено';
    btn.classList.add('done');
}

function markDone(){
    if(alreadyDone) return;
    const arr = JSON.parse(localStorage.getItem('oshka_done')||'[]');
    if(!arr.includes(7)) arr.push(7);
    localStorage.setItem('oshka_done', JSON.stringify(arr));
    confetti();
    setTimeout(()=>{
        document.getElementById('done-wrap').innerHTML=`<div class="done-two">
            <button class="btn-map" onclick="window.location.href='index.html'">← На карту</button>
            <button class="btn-nxt" onclick="window.location.href='task-8.html'">Следующее приключение →</button>
        </div>`;
    }, 900);
}

function confetti(){
    const colors=['#84cc16','#7c3aed','#f59e0b','#ec4899','#a3e635','#7dd3fc'];
    for(let i=0;i<28;i++){
        setTimeout(()=>{
            const el=document.createElement('div');
            el.style.cssText=`position:fixed;left:${10+Math.random()*80}%;top:-20px;
                width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                border-radius:${Math.random()>.5?'50%':'3px'};
                animation:fall ${1.2+Math.random()*1.8}s forwards;z-index:999;`;
            document.body.appendChild(el);
            setTimeout(()=>el.remove(),3500);
        },i*70);
    }
}

function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
