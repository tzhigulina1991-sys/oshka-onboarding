<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стратегия аттестации — Онлайн Школа №1</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
            background:linear-gradient(160deg,#1a0840 0%,#2d1b69 50%,#1a0840 100%);
            min-height:100vh; color:#fff;
        }
        .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
        .star  { position:absolute; background:#fff; border-radius:50%;
                 animation:twinkle var(--d,3s) infinite alternate; }
        @keyframes twinkle {
            0%  { opacity:.1; transform:scale(1); }
            100%{ opacity:.7; transform:scale(1.4); }
        }
        .topbar {
            position:sticky; top:0; z-index:50;
            background:rgba(26,8,64,.9); backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(255,255,255,.08);
            padding:14px 20px; display:flex; align-items:center; gap:12px;
        }
        .back-btn {
            display:flex; align-items:center; gap:6px;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
            border-radius:10px; padding:7px 13px; font-size:13px; font-weight:600;
            cursor:pointer; color:#fff; text-decoration:none; transition:background .2s;
        }
        .back-btn:hover { background:rgba(255,255,255,.16); }
        .topbar-title { font-size:15px; font-weight:700; flex:1; }
        .task-badge {
            background:rgba(251,191,36,.15); border:1px solid rgba(251,191,36,.35);
            border-radius:99px; padding:5px 12px; font-size:12px;
            color:#fcd34d; font-weight:700;
        }
        .page {
            position:relative; z-index:1;
            max-width:620px; margin:0 auto; padding:32px 20px 110px;
        }

        /* HERO */
        .hero {
            background:linear-gradient(135deg,rgba(180,83,9,.22),rgba(251,191,36,.1));
            border:1px solid rgba(251,191,36,.35); border-radius:24px;
            padding:36px 28px; margin-bottom:20px; text-align:center;
        }
        .hero-emoji { font-size:64px; margin-bottom:16px; display:block; }
        .hero h1 { font-size:26px; font-weight:800; line-height:1.25; margin-bottom:12px; }
        .hero p  { font-size:15px; line-height:1.7; opacity:.85; }

        .card {
            background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
            border-radius:20px; padding:26px 24px; margin-bottom:16px;
        }
        .card-icon { font-size:28px; margin-bottom:10px; display:block; }
        .card h2   { font-size:17px; font-weight:800; margin-bottom:12px; }
        .card p    { font-size:14px; line-height:1.7; opacity:.82; }

        /* ПОРЯДОК ДЕЙСТВИЙ */
        .order-steps { display:flex; flex-direction:column; gap:12px; margin-top:4px; }
        .order-step {
            display:flex; gap:16px; align-items:flex-start;
            border-radius:16px; padding:18px 20px; position:relative;
        }
        .order-step.first {
            background:linear-gradient(135deg,rgba(180,83,9,.15),rgba(146,64,14,.1));
            border:1.5px solid rgba(251,191,36,.35);
        }
        .order-step.second {
            background:rgba(124,58,237,.1); border:1px solid rgba(124,58,237,.3);
        }
        .order-step-badge {
            width:36px; height:36px; border-radius:50%; flex-shrink:0;
            display:flex; align-items:center; justify-content:center;
            font-size:16px; font-weight:900;
        }
        .order-step.first  .order-step-badge { background:linear-gradient(135deg,#b45309,#92400e); }
        .order-step.second .order-step-badge { background:linear-gradient(135deg,#7c3aed,#a855f7); }
        .order-step-body { flex:1; }
        .order-step-title { font-size:15px; font-weight:800; margin-bottom:4px; }
        .order-step.first  .order-step-title { color:#fcd34d; }
        .order-step.second .order-step-title { color:#c4b5fd; }
        .order-step-desc  { font-size:13px; opacity:.75; line-height:1.5; }
        .order-step-tag {
            display:inline-block; margin-top:7px;
            background:rgba(255,255,255,.1); border-radius:99px;
            padding:4px 11px; font-size:11px; font-weight:700; opacity:.8;
        }

        /* СТРЕЛКА МЕЖДУ ШАГАМИ */
        .order-arrow {
            text-align:center; font-size:22px; opacity:.4; margin:-4px 0;
        }

        /* ПОЧЕМУ ТАК */
        .why-card {
            background:rgba(132,204,22,.08); border:1px solid rgba(132,204,22,.22);
            border-radius:20px; padding:24px; margin-bottom:16px;
        }
        .why-card h2 { font-size:17px; font-weight:800; margin-bottom:12px; }
        .why-list { display:flex; flex-direction:column; gap:10px; }
        .why-item {
            display:flex; gap:12px; align-items:flex-start;
            padding:12px 14px; border-radius:13px;
            background:rgba(255,255,255,.04); border:1px solid rgba(132,204,22,.15);
        }
        .why-icon { font-size:20px; flex-shrink:0; }
        .why-text { font-size:13px; line-height:1.5; opacity:.82; }
        .why-text strong { display:block; font-weight:700; margin-bottom:2px; color:#a3e635; opacity:1; }

        /* ФИНАЛЬНЫЙ АККОРД */
        .final-card {
            background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(180,83,9,.1));
            border:1.5px solid rgba(251,191,36,.4);
            border-radius:20px; padding:26px 24px; margin-bottom:16px;
            text-align:center;
        }
        .final-card .final-icon { font-size:48px; margin-bottom:12px; display:block; }
        .final-card h2 { font-size:18px; font-weight:800; color:#fcd34d; margin-bottom:10px; }
        .final-card p  { font-size:14px; line-height:1.7; opacity:.82; }

        .done-wrap {
            position:fixed; bottom:0; left:0; right:0; z-index:40;
            padding:16px 20px 28px;
            background:linear-gradient(to top,#1a0840 65%,transparent);
        }
        .done-btn {
            display:block; width:100%; max-width:620px; margin:0 auto;
            padding:18px; border:none; border-radius:16px;
            font-size:16px; font-weight:800; cursor:pointer;
            background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff;
            transition:opacity .2s, transform .1s;
        }
        .done-btn:hover  { opacity:.9; transform:translateY(-1px); }
        .done-btn:active { transform:translateY(0); }
        .done-btn.done {
            background:rgba(132,204,22,.15); border:1px solid rgba(132,204,22,.3);
            color:#a3e635; cursor:default; transform:none !important;
        }
                .done-two { display:flex; gap:10px; max-width:620px; margin:0 auto; }
        .btn-map  { padding:18px 16px; border:1px solid rgba(255,255,255,.2); border-radius:14px;
                    font-size:14px; font-weight:700; cursor:pointer;
                    background:rgba(255,255,255,.08); color:#fff; white-space:nowrap;
                    flex-shrink:0; transition:background .2s; }
        .btn-map:hover { background:rgba(255,255,255,.15); }
        .btn-nxt  { flex:1; padding:18px; border:none; border-radius:14px;
                    font-size:15px; font-weight:800; cursor:pointer;
                    background:linear-gradient(135deg,#84cc16,#65a30d); color:#fff;
                    transition:opacity .2s, transform .1s; }
        .btn-nxt:hover  { opacity:.9; transform:translateY(-2px); }
        .btn-nxt:active { transform:translateY(0); }
        @keyframes fall { to { transform:translateY(110vh) rotate(540deg); opacity:0; } }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="topbar">
    <a class="back-btn" href="index.html">← Назад</a>
    <div class="topbar-title">Приключение 16</div>
    <div class="task-badge">🏆 Аттестация</div>
</div>
<div class="page" id="page"></div>
<div class="done-wrap">
    <button class="done-btn" id="done-btn" onclick="markDone()">🏆 Готовы к аттестации!</button>
</div>
<script>
(function(){
    const c=document.getElementById('stars');
    for(let i=0;i<45;i++){
        const s=document.createElement('div'); s.className='star';
        const sz=Math.random()*2.5+.6;
        s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
        c.appendChild(s);
    }
})();

const profile   = JSON.parse(localStorage.getItem('oshka_profile')||'{}');

const done      = JSON.parse(localStorage.getItem('oshka_done')||'[]');
const alreadyDone = done.includes(16);

document.getElementById('page').innerHTML = `

    <div class="hero">
        <span class="hero-emoji">🏆</span>
        <h1>Стратегия аттестации</h1>
        <p>Последний и очень важный совет перед стартом. Правильный порядок действий поможет всё успеть и сдать без лишнего стресса.</p>
    </div>

    <div class="card">
        <span class="card-icon">🗂</span>
        <h2>Правильный порядок</h2>
        <p style="margin-bottom:16px">Мы всегда рекомендуем начинать аттестацию именно в таком порядке:</p>
        <div class="order-steps">
            <div class="order-step first">
                <div class="order-step-badge">1</div>
                <div class="order-step-body">
                    <div class="order-step-title">Сначала — контрольные работы (КР)</div>
                    <div class="order-step-desc">Письменные задания требуют времени на проверку учителем. Чем раньше сдать — тем больше времени останется на исправление ошибок.</div>
                    <span class="order-step-tag">⏳ Проверяются до 4 дней</span>
                </div>
            </div>
            <div class="order-arrow">↓</div>
            <div class="order-step second">
                <div class="order-step-badge">2</div>
                <div class="order-step-body">
                    <div class="order-step-title">Потом — финальные тесты (ФТ)</div>
                    <div class="order-step-desc">Тесты проверяются мгновенно и результат виден сразу. Их можно пройти в удобное время, пока ждёте оценку за КР.</div>
                    <span class="order-step-tag">⚡ Результат сразу</span>
                </div>
            </div>
        </div>
    </div>

    <div class="why-card">
        <span class="card-icon" style="font-size:28px;display:block;margin-bottom:10px">🤔</span>
        <h2>Почему именно так?</h2>
        <div class="why-list">
            <div class="why-item">
                <div class="why-icon">⏱</div>
                <div class="why-text">
                    <strong>Время на проверку КР</strong>
                    Если сдать КР в последний день — можно не успеть получить оценку до закрытия аттестационного периода
                </div>
            </div>
            <div class="why-item">
                <div class="why-icon">🔄</div>
                <div class="why-text">
                    <strong>Время на работу над ошибками</strong>
                    Если оценка за КР придёт заранее — останется время разобрать ошибки и закрепить материал перед тестом
                </div>
            </div>
            <div class="why-item">
                <div class="why-icon">😌</div>
                <div class="why-text">
                    <strong>Меньше стресса</strong>
                    Когда самое сложное уже сдано, тест проходится спокойнее и увереннее
                </div>
            </div>
        </div>
    </div>

    <div class="final-card">
        <span class="final-icon">🌟</span>
        <h2>Вы прошли весь онбординг!</h2>
        <p>Теперь вы знаете всё, что нужно для успешного обучения в нашей школе. Удачи на аттестации — мы верим в вас!</p>
    </div>
`;

if(alreadyDone){
    const btn = document.getElementById('done-btn');
    btn.textContent = '✓ Уже выполнено';
    btn.classList.add('done');
}

function markDone(){
    if(alreadyDone) return;
    const arr = JSON.parse(localStorage.getItem('oshka_done')||'[]');
    if(!arr.includes(16)) arr.push(16);
    localStorage.setItem('oshka_done', JSON.stringify(arr));
    bigConfetti();
    const btn = document.getElementById('done-btn');
    btn.textContent = '🎉 Путешествие завершено!';
    btn.classList.add('done');
    setTimeout(()=>{ window.location.href='finish.html'; }, 2200);
}

function bigConfetti(){
    const colors=['#84cc16','#7c3aed','#f59e0b','#ec4899','#a3e635','#fcd34d','#c084fc','#fdba74'];
    for(let i=0;i<55;i++){
        setTimeout(()=>{
            const el=document.createElement('div');
            el.style.cssText=`position:fixed;left:${5+Math.random()*90}%;top:-20px;
                width:${7+Math.random()*10}px;height:${7+Math.random()*10}px;
                background:${colors[Math.floor(Math.random()*colors.length)]};
                border-radius:${Math.random()>.5?'50%':'3px'};
                animation:fall ${1.4+Math.random()*2}s forwards;z-index:999;`;
            document.body.appendChild(el);
            setTimeout(()=>el.remove(),4000);
        },i*55);
    }
}

function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
